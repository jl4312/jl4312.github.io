<!-- Project popup. Its content comes from data/projects.js -->
<div id="myModal" class="modal">
	<div class="modal-content">
		<div class="modal-header">
			<section><h2 id="projectName"></h2></section>
			<section class="close" role="button" tabindex="0" aria-label="Close"><h2><b>&times;</b></h2></section>
		</div>
		<div id="projectPopups"></div>
		<div id="moreProjects" class="more-proj"></div>
	</div>
</div>
<script>
	buildProjectPopups();
	document.querySelector("#myModal .close").onclick = function () { close(); };
	document.querySelector("#myModal .close").onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); close(); } };
</script>
